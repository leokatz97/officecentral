# Manufacturer defaults — country rules locked by Leo 2026-05-30
# warranty values populated from source per product (varies by line)
# certifications_typical = likely-present; confirm from source

global_furniture_group:
  warranty: null  # SOURCE PER PRODUCT — NEVER DEFAULT. GFG warranty varies by catalog: value/MVL/OTG seating = 2yr, value laminate non-moving = 5yr (officestogo.com/warranty); Global premium seating = ltd lifetime frame + 5yr upholstery + 12yr mechanism (globalfurnituregroup.com/warranty). See operational lesson AGENT-WARRANTY-DEFAULTS-NEED-SOURCE-VERIFICATION in bbi-build-state.md.
  country_of_manufacture: Canada
  certifications_typical: [GREENGUARD, BIFMA]
  notes: |
    Sub-brands Basics, Offices To Go (OTG), ObusForme — manufacturer field = Global Furniture Group;
    capture sub-brand in product_line. All sub-brands also Canada-manufactured.
    Cert pattern (observed Session 4, 20-product batch): ANSI/BIFMA is reliably confirmable at the
    product/series page; GREENGUARD is only confirmable for some lines (e.g. Newland desking carries
    GREENGUARD/GREENGUARD Gold) and is frequently NOT documented for seating/filing lines. Do NOT
    auto-apply GREENGUARD as a default — confirm per product, else leave certifications=[] and flag missing.
    Newland is a value desking line sold under the Offices To Go sub-brand; spec sheets often live on
    officestogo.com and authorized-dealer pages (e.g. ugoburo.ca), not globalfurnituregroup.com.

