  - id: medical-dental-clinic-chairs
    role: landing                    # review/comparison landing; funnels to carried clinic patient/guest/staff seating
    icp: both
    surface: landing_page            # ds-review-base.liquid + page.review-medical-clinics.json (Step 6 review Page #3)
    slug: /pages/best-office-chairs-medical-clinics
    status: locked
    cta_mode: cart_then_quote
    primary_keyword: medical office chair
    secondary_keywords:
