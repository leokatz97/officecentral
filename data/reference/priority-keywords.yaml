    deconflicts: executive office chair   # Track-A soft-claim, see note
    note: >-
      Step 6 review Page #2 (PR #147, page gid://shopify/Page/172091670841, LIVE — published
      2026-06-15). LOCKED owner of "best executive office chair" (KD11, review intent) + the four
