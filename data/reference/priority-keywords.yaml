    note: >-
      Step 5a commercial hub (PR #139, page gid://shopify/Page/172018008377, UNPUBLISHED pending
      Leo copy review + hero image + manual publish). LOCKED owner of the four terms above — these
      are carved out of the PENDING `ergonomic-seating-desks-storage` cluster and must NOT be
      reassigned when that cluster is split. Desk/storage terms in that cluster remain unclaimed.

  - id: heavy-duty-chairs
