      chair / office chair for back pain — owned by /pages/ergonomic-office-chairs).

  - id: executive-chairs
    role: landing                    # review/comparison landing; funnels to carried executive/management seating
    icp: both
    surface: landing_page            # ds-review-base.liquid + page.review-executive.json (Step 6 review Page #2)
