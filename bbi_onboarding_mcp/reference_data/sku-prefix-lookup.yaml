# Rich decode metadata for prefixes resolved in the 2026-05-31 wrap-up
# (Block 4 Session 3). Each entry records the supplier, whether it is a single
# manufacturer or a distributor aggregating multiple OEMs, the dominant internal
# sub-code families, and the source used to confirm the decode.
decoded_details:
  HDL:
    vendor: Heartwood Distributors Ltd.
    type: Distributor (multiple OEM lines)
    key_sub_codes:
      - INV/INVR/INVMP/INVREC = Innovations laminate desking (flagship)
      - LEV/LEVSR = Levels bookcases
      - Tucana, SOHO, Upscale series
    note: >-
      59 products / 203 variant SKUs — largest single prefix family. Distributor
      pattern, not single-manufacturer. Same brand family as the existing HTW =
      Heartwood mapping.
  IOF:
    vendor: Intelligent Office Furniture
    type: Manufacturer (Canadian-made)
    key_sub_codes:
      - UN = Universal casegoods
      - RAPB = racetrack/laminate conference tables
      - PN/HA = height-adjustable tables
      - LOCK = laminate lockers
    source: ioflive.com / intelligentofficefurniture.com
    note: Made in Canada — relevant for OECM/Canadian-owned positioning.
  RIC:
    vendor: Richelieu (Richelieu Ergo)
    type: Manufacturer + distributor hybrid
    key_sub_codes:
      - JAX = sit-stand keyboard arms
      - Momentum = keyboard arms
      - S2S/Sit2Stand = sit-stand workstations
      - PP = Power Plant
      - PBK/OME/DS = charging accessories
    source: richelieu.com (numeric part numbers are exact matches)
    note: Accessories/ergo add-ons — good cross-sell on desk PDPs.
  HZN:
    vendor: Horizon Furniture
    type: Distributor (multiple OEM seating + accessories)
    key_sub_codes:
      - Shoptech = industrial/lab task stools
      - DEM = Demeter mid-back ergonomic
      - NK/STAXX = stacking/banquet
      - ECAPS/ECA/KL/JV/CM = keyboard trays, iPad holders, ergonomic accessories
    source: horizon-furniture.com
    note: >-
      STAXX originally Source International, Demeter is contract — Horizon is the
      source catalog BBI buys through.

